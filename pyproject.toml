[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "teachify"
version = "0.3.0"
description = "Teach Mode for any LLM — the AI guides, you type, you learn"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aman Siddiqui", email = "aman.siddiqui114@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "learning", "teach", "llm", "education", "claude-code", "cursor"]
dependencies = ["mcp>=1.0,<2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]

[project.scripts]
teachify = "teachify.__main__:main"

[project.urls]
Homepage = "https://github.com/iamamansid/teachify"
Repository = "https://github.com/iamamansid/teachify"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teachify = ["prompts/*.md", "tasks/*.json", "commands/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
