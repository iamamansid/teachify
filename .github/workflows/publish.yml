# Publish to PyPI via OIDC trusted publishing (no API tokens).
# Trigger: push a tag like v0.3.0  ->  builds sdist+wheel  ->  uploads to PyPI.
# One-time setup (repo owner, in browser):
#   https://pypi.org/manage/account/publishing/  ->  "Add a new pending publisher"
#   PyPI Project Name: teachify | Owner: iamamansid
#   Repository name: teachify | Workflow name: publish.yml
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for PyPI OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
